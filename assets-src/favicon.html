<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<style>
  @font-face {
    font-family: 'Agbalumo';
    src: url('../fonts/agbalumo-regular.woff2') format('woff2');
  }
  html, body { margin: 0; }
  #fav {
    width: 512px;
    height: 512px;
    background: #EF7E88;
    border-radius: 108px;
    display: grid;
    place-items: center;
    box-sizing: border-box;
    border: 26px solid #2B1516;
  }
  #fav span {
    font-family: 'Agbalumo', cursive;
    font-size: 340px;
    line-height: 1;
    color: #FDF2E7;
    -webkit-text-stroke: 10px #2B1516;
    text-shadow: 18px 18px 0 #2B1516;
    transform: rotate(-6deg) translateY(-14px);
  }
</style>
</head>
<body><div id="fav"><span>P</span></div></body>
</html>
